<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Editorial warm palette - ink on cream with jewel accents */
  --bg:#f4f1ea;--bg2:# faf8f3;--paper:#fffdf8;--paper2:#f0ece1;
  --ink:#1c1a17;--ink2:#5a554c;--ink3:#9a9488;
  --line:#e3ddd0;--line2:#d4cdbd;
  --plum:#6b3a5b;--plum-s:#9c5d87;--plum-bg:#f0e4ec;
  --moss:#4a5d3a;--moss-s:#7a8f5f;--moss-bg:#e6ebdd;
  --rust:#a04f2c;--rust-s:#c67a4f;--rust-bg:#f3e3d8;
  --gold:#9a7820;--gold-s:#c2a04a;--gold-bg:#f2ead0;
  --teal:#2c6b6b;--teal-s:#4f9c9c;--teal-bg:#daeceb;
  --berry:#8a2d4a;--berry-bg:#f3dde4;
  --r:16px;--r2:22px;--r3:28px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);height:100%;overflow:hidden;display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit}input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.serif{font-family:'Fraunces',serif}

/* ═══ TOPBAR ═══ */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg);flex-shrink:0;border-bottom:1px solid var(--line)}
.topbar h1{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-.5px}
.topbar h1 em{font-style:italic;color:var(--plum)}
.topbar-btns{display:flex;gap:8px}
.topbar-btns button{background:var(--paper);border:1px solid var(--line2);color:var(--ink2);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}
.topbar-btns button:active{transform:scale(.9);background:var(--paper2)}

.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.inner{padding:20px 16px 28px;max-width:1300px;margin:0 auto}

/* ═══ BOTTOM NAV ═══ */
.bnav{display:flex;background:var(--paper);border-top:1px solid var(--line);flex-shrink:0;padding:6px 10px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 2px 5px;color:var(--ink3);font-size:9px;font-weight:600;gap:4px;border:none;background:none;transition:all .2s;position:relative}
.bni.on{color:var(--plum)}
.bni .dot{width:5px;height:5px;border-radius:50%;background:var(--plum);position:absolute;top:2px;opacity:0;transition:opacity .2s}
.bni.on .dot{opacity:1}
.bni svg{width:22px;height:22px;stroke-width:1.6}
.side{display:none}

/* ═══ HEADINGS ═══ */
.ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.pt{font-family:'Fraunces',serif;font-size:28px;font-weight:600;letter-spacing:-.6px;line-height:1}
.pt small{display:block;font-family:'Inter',sans-serif;font-size:12px;color:var(--ink3);font-weight:500;margin-top:5px;letter-spacing:.2px}
.pa{display:flex;gap:8px;align-items:center}
.hb{padding:9px 16px;border-radius:50px;border:1px solid var(--line2);background:var(--paper);color:var(--ink2);font-size:12px;font-weight:600;white-space:nowrap;transition:all .2s}
.hb:active{transform:scale(.95)}
.hb.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ═══ MONTH STEPPER ═══ */
.mstep{display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line2);border-radius:50px;padding:3px}
.mstep button{width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--ink2);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mstep button:active{background:var(--paper2)}
.mstep .ml{font-size:12px;font-weight:700;min-width:90px;text-align:center;text-transform:capitalize}

.grid{display:grid;gap:14px}

/* ═══ CARDS ═══ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:20px}
.ct{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.cv{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;letter-spacing:-1px}
.cs2{font-size:11px;color:var(--ink3);margin-top:6px}

/* Hero stat card (editorial) */
.hero-stat{background:var(--ink);color:var(--bg);border-radius:var(--r3);padding:26px;position:relative;overflow:hidden}
.hero-stat .hs-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.6;margin-bottom:10px}
.hero-stat .hs-val{font-family:'Fraunces',serif;font-size:34px;font-weight:500;line-height:1.05;letter-spacing:-1px}
.hero-stat .hs-sub{font-size:12px;opacity:.7;margin-top:8px}
.hero-stat .hs-deco{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border:1px solid rgba(255,255,255,.12);border-radius:50%}
.hero-stat .hs-deco2{position:absolute;right:10px;bottom:-50px;width:100px;height:100px;border:1px solid rgba(255,255,255,.08);border-radius:50%}

/* Accent stat tiles */
.tile{border-radius:var(--r2);padding:18px;position:relative;overflow:hidden}
.tile .tl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.75;margin-bottom:6px}
.tile .tv{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1;letter-spacing:-.5px}
.tile .tsub{font-size:10px;opacity:.65;margin-top:5px}
.tile-plum{background:var(--plum-bg);color:var(--plum)}
.tile-moss{background:var(--moss-bg);color:var(--moss)}
.tile-rust{background:var(--rust-bg);color:var(--rust)}
.tile-teal{background:var(--teal-bg);color:var(--teal)}
.tile-gold{background:var(--gold-bg);color:var(--gold)}

/* ═══ FORMS ═══ */
.fr{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.fr label{font-size:12px;color:var(--ink2);min-width:66px;font-weight:600;flex-shrink:0}
.fr select,.fr input{background:var(--bg);border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:10px 13px;font-size:13px;flex:1;min-width:0;transition:all .2s}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-bg)}
.fr input[type=time],.fr input[type=number]{font-family:'JetBrains Mono',monospace}
.btn{padding:11px 20px;border-radius:50px;border:none;font-size:12px;font-weight:700;transition:all .2s;letter-spacing:.3px}
.btn:active{transform:scale(.95)}
.bp{background:var(--ink);color:var(--bg)}.bd{background:var(--berry-bg);color:var(--berry)}.bg2{background:var(--paper);color:var(--ink2);border:1px solid var(--line2)}
.badge{display:inline-flex;font-size:9px;padding:3px 9px;border-radius:50px;font-weight:700;letter-spacing:.3px}
.bgen{background:var(--gold-bg);color:var(--gold)}.bok{background:var(--moss-bg);color:var(--moss)}

/* ═══ CALENDAR ═══ */
.cpill{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.cpill::-webkit-scrollbar{display:none}
.cpill span{padding:6px 13px;border-radius:50px;background:transparent;border:1px solid var(--line2);color:var(--ink3);font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:all .2s}
.cpill span.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cnav button{background:var(--bg);border:1px solid var(--line2);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cnav button:active{transform:scale(.9)}
.cnav .cm{font-family:'Fraunces',serif;font-size:18px;font-weight:600;text-transform:capitalize;letter-spacing:-.3px}
.chd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.chd span{text-align:center;font-size:9px;color:var(--ink3);font-weight:700;padding:5px 0;text-transform:uppercase;letter-spacing:.5px}
.cbd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.c{border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;position:relative;overflow:hidden;min-height:54px;padding:5px 2px;gap:2px;transition:all .15s;background:var(--bg)}
.c.emp{visibility:hidden}
.c:active{transform:scale(.92)}
.c.tod{box-shadow:inset 0 0 0 2px var(--ink)}
.c.sel{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
.c.sel .ctime{color:rgba(255,255,255,.75)!important}
.c.sel .clbl{color:rgba(255,255,255,.7)!important}

.c.tw{background:#e4d0de;color:var(--ink)}
.c.tw .ctime{color:var(--plum)}
.c.tr{background:transparent;border:1.5px dashed var(--line2);color:var(--ink)}
.c.tr .clbl{color:var(--ink2)}
.c.trf{background:#ecd3c2;color:var(--ink)}
.c.trf .ctime{color:var(--rust)}
.c.tc{background:#d8e2c8;color:var(--ink)}
.c.tc .clbl{color:var(--moss)}
.c.tf{background:#ecdfb8;color:var(--ink)}
.c.tf .ctime{color:var(--gold)}
.c.toff{background:transparent;border:1.5px dashed var(--line);color:var(--ink)}
.c.toff .clbl{color:var(--ink2)}
.c.gen{opacity:.5}

.ctime{font-family:'JetBrains Mono',monospace;font-size:8px;line-height:1.15;letter-spacing:-.3px;font-weight:500}
.clbl{font-size:8px;font-weight:700;letter-spacing:.5px}
.cdot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%}
.cfer{position:absolute;top:2px;right:3px;font-size:8px}

.dp{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:20px;margin-top:14px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ═══ LEGEND ═══ */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);font-weight:500}
.leg .ld{width:12px;height:12px;border-radius:4px}

/* ═══ SALARY ═══ */
.shero{background:var(--ink);color:var(--bg);border-radius:var(--r3);padding:30px 22px;margin-bottom:18px;text-align:center;position:relative;overflow:hidden}
.shero .sl{font-size:11px;text-transform:uppercase;letter-spacing:2px;opacity:.55;margin-bottom:10px}
.shero .sa{font-family:'Fraunces',serif;font-size:44px;font-weight:500;letter-spacing:-1.5px;line-height:1}
.shero .srow{display:flex;justify-content:center;gap:24px;margin-top:16px}
.shero .si{text-align:center}
.shero .sil{font-size:8px;text-transform:uppercase;letter-spacing:1px;opacity:.5}
.shero .siv{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;margin-top:3px}
.shero .ss{font-size:11px;opacity:.6;margin-top:14px}
.ptbl{width:100%;border-collapse:collapse;font-size:12px}
.ptbl th{text-align:left;padding:10px 8px;font-size:9px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line2)}
.ptbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.ptbl .am{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:right}
.tg{font-size:7px;padding:2px 5px;border-radius:50px;font-weight:700;margin-right:2px}
.tn{background:var(--plum-bg);color:var(--plum)}.td2{background:var(--gold-bg);color:var(--gold)}.tfe{background:var(--gold-bg);color:var(--gold)}.ts{background:var(--rust-bg);color:var(--rust)}.tk{background:var(--teal-bg);color:var(--teal)}

/* Stat bars */
.sb{margin-bottom:11px}
.sbt{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}.sbt .sl2{color:var(--ink2);font-weight:500}.sbt .sv{font-family:'JetBrains Mono',monospace;font-weight:600}
.sbk{height:7px;background:var(--paper2);border-radius:50px;overflow:hidden}
.sbf{height:100%;border-radius:50px;transition:width .5s ease}

/* ═══ MODAL ═══ */
.mbg{display:none;position:fixed;inset:0;background:rgba(28,26,23,.4);backdrop-filter:blur(4px);z-index:300;align-items:flex-end;justify-content:center}
.mbg.on{display:flex}
.mbox{background:var(--paper);border-radius:var(--r3) var(--r3) 0 0;width:100%;max-width:500px;padding:24px;max-height:78vh;overflow-y:auto}
.mbox h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.mbox h3 button{background:var(--bg);border:1px solid var(--line2);color:var(--ink2);font-size:15px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ═══ DESKTOP ═══ */
@media(min-width:860px){
  body{flex-direction:row}
  .topbar{display:none}.bnav{display:none}
  .side{display:flex;flex-direction:column;width:250px;background:var(--paper);border-right:1px solid var(--line);height:100vh;flex-shrink:0}
  .side-logo{padding:26px 22px 22px;border-bottom:1px solid var(--line)}
  .side-logo h1{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:-.5px}
  .side-logo h1 em{font-style:italic;color:var(--plum)}
  .side-logo .sub{font-size:11px;color:var(--ink3);font-weight:500;margin-top:3px}
  .side-nav{flex:1;padding:14px 12px;overflow-y:auto}
  .snl{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink3);padding:14px 12px 6px;font-weight:700}
  .snb{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:none;background:transparent;color:var(--ink2);font-size:13px;font-weight:600;border-radius:12px;text-align:left;position:relative;transition:all .15s}
  .snb:hover{background:var(--bg)}.snb.on{background:var(--ink);color:var(--bg)}
  .snb svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.6}
  .side-ft{padding:16px 18px;border-top:1px solid var(--line);font-size:10px;color:var(--ink3)}
  .content{flex:1}.inner{padding:30px 36px 44px}
  .g2d{grid-template-columns:1fr 1fr}.g3d{grid-template-columns:1fr 1fr 1fr}.g4d{grid-template-columns:repeat(4,1fr)}
  .lsplit{display:grid;grid-template-columns:1fr 380px;gap:20px}
  .pt{font-size:34px}
  .c{min-height:64px;font-size:14px}.ctime{font-size:9px}
  .mbg.on{align-items:center}.mbox{border-radius:var(--r3)}
}
</style>
</head>

function pgSal(){var r=S.rates,peM=pM+1,peY=pY;if(peM>11){peM=0;peY++}var ps=new Date(pY,pM,16),pe=new Date(peY,peM,15);var totN=0,totS=0,totF=0,totOT=0,totH=0,wD=0,dayR=[],totPN=0,totPJ=0,totKM=0,totRenf=0,cur=new Date(ps);while(cur<=pe){var k=K(cur.getFullYear(),cur.getMonth(),cur.getDate()),dd=S.days[k];if(dd&&(dd.type==='work'||dd.type==='ferie'||dd.type==='renfort')&&dd.start&&dd.end){var tH=cH(dd.start,dd.end),nh=nHr(dd.start,dd.end),isSun=cur.getDay()===0,isFer=!!gF(k)||(dd.type==='ferie'),isRenf=dd.type==='renfort',oH=dd.ot||0;var oHrs=oH/60;var nB=nh*r.b*(r.n/100),sB=isSun?tH*r.b*(r.s/100):0,fB=isFer?tH*r.b*(r.f/100):0,renfB=isRenf?tH*r.b*((r.renf||25)/100):0,oB=0;if(oHrs>0)oB=Math.min(oHrs,8)*r.b*(r.o1/100)+Math.max(oHrs-8,0)*r.b*(r.o2/100);var isNight=nh>0;var pnV=isNight?(r.pn||0):0;var pjV=isNight?0:(r.pj||0);var kmV=r.km||0;totN+=nB;totS+=sB;totF+=fB;totOT+=oB;totRenf+=renfB;totH+=tH;totPN+=pnV;totPJ+=pjV;totKM+=kmV;wD++;dayR.push({k:k,tH:tH,nh:nh,isSun:isSun,isFer:isFer,isRenf:isRenf,oH:oH,pn:pnV,pj:pjV,km:kmV,pay:tH*r.b+nB+sB+fB+renfB+oB+pnV+pjV+kmV,date:new Date(cur)})}cur.setDate(cur.getDate()+1)}var base=r.mH*r.b,grand=base+totN+totS+totF+totOT+totRenf,indemnites=totPN+totPJ+totKM,cotPct=(r.cot||23.5)/100,netSocial=grand*(1-cotPct),netTotal=netSocial+indemnites;
  var rows='';for(var i=0;i<dayR.length;i++){var x=dayR[i],dn=DS[x.date.getDay()],ds=dn+' '+String(x.date.getDate()).padStart(2,'0')+'/'+(x.date.getMonth()+1);var tg='';if(x.nh>0)tg+='<span class="tg tn">'+fH(x.nh)+'N</span>';if(x.isSun)tg+='<span class="tg td2">DIM</span>';if(x.isFer)tg+='<span class="tg tfe">FÉR</span>';if(x.isRenf)tg+='<span class="tg ts">RENF</span>';if(x.oH>0)tg+='<span class="tg ts">+'+x.oH+'min</span>';if(x.pn>0)tg+='<span class="tg tk">PN</span>';if(x.pj>0)tg+='<span class="tg tk">PJ</span>';tg+='<span class="tg tk">KM</span>';var dd2=S.days[x.k];rows+='<tr><td style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:var(--ink2);white-space:nowrap">'+ds+'</td><td style="font-family:\'JetBrains Mono\',monospace;font-size:10px;white-space:nowrap">'+dd2.start+'→'+dd2.end+'</td><td>'+tg+'</td><td class="am" style="color:var(--moss);font-size:11px">'+fE(x.pay)+'</td></tr>'}
  return '<div class="ph"><div class="pt">Salaire<small>Période 16 → 15</small></div><div class="mstep"><button onclick="pM--;if(pM<0){pM=11;pY--}render()">‹</button><span class="ml">'+MO[pM].substring(0,4)+'. '+pY+'</span><button onclick="pM++;if(pM>11){pM=0;pY++}render()">›</button></div></div><div class="shero"><div class="sl">Net estimé + indemnités</div><div class="sa serif">'+fE(netTotal)+'</div><div class="srow"><div class="si"><div class="sil">Brut</div><div class="siv">'+fE(grand)+'</div></div><div class="si"><div class="sil">Cotis. '+r.cot+'%</div><div class="siv">-'+fE(grand*cotPct)+'</div></div><div class="si"><div class="sil">Indemn.</div><div class="siv">+'+fE(indemnites)+'</div></div></div><div class="ss">'+wD+' jours · '+fH(totH)+'</div></div><div class="grid g2d" style="margin-bottom:14px"><div class="card"><div class="ct">Décomposition</div>'+sbar('Base mensuelle',fE(base),'var(--plum)',100)+(totN>0?sbar('Nuit +'+r.n+'%','+'+fE(totN),'var(--plum-s)',45):'')+(totS>0?sbar('Dimanche +'+r.s+'%','+'+fE(totS),'var(--gold)',45):'')+(totF>0?sbar('Férié +'+r.f+'%','+'+fE(totF),'var(--gold-s)',45):'')+(totOT>0?sbar('Heures supp +'+r.o1+'%','+'+fE(totOT),'var(--rust)',30):'')+(totRenf>0?sbar('Renfort +'+(r.renf||25)+'%','+'+fE(totRenf),'var(--rust-s)',30):'')+'<div style="border-top:1.5px solid var(--ink);padding-top:8px;margin-top:8px;display:flex;justify-content:space-between;font-weight:700;font-size:13px"><span>Total brut</span><span style="font-family:\'JetBrains Mono\',monospace;color:var(--ink)">'+fE(grand)+'</span></div><div style="display:flex;justify-content:space-between;font-size:11px;margin-top:5px;color:var(--berry)"><span>Cotisations −'+r.cot+'%</span><span style="font-family:\'JetBrains Mono\',monospace;font-weight:600">-'+fE(grand*cotPct)+'</span></div><div style="display:flex;justify-content:space-between;font-size:13px;margin-top:5px;font-weight:700"><span>Net social</span><span style="font-family:\'JetBrains Mono\',monospace;color:var(--mo function pgWk(){var dim=new Date(CY,CM+1,0).getDate(),wks={};for(var d=1;d<=dim;d++){var dt=new Date(CY,CM,d),wk=iW(dt);if(!wks[wk])wks[wk]={h:0,w:0,r:0,f:0,rf:0,g:false};var dd=S.days[K(CY,CM,d)];if(!dd)continue;if(dd.gen)wks[wk].g=true;if(dd.type==='work'){wks[wk].h+=cH(dd.start,dd.end);wks[wk].w++}if(dd.type==='renfort'){wks[wk].h+=cH(dd.start,dd.end);wks[wk].rf++}if(dd.type==='rps')wks[wk].r++;if(dd.type==='ferie'){wks[wk].f++;if(dd.start&&dd.end)wks[wk].h+=cH(dd.start,dd.end)}}var rows='',keys=Object.keys(wks).sort(function(a,b){return a-b});for(var i=0;i<keys.length;i++){var w=keys[i],x=wks[w];rows+='<tr><td style="font-weight:700">S'+w+(x.g?' <span class="badge bgen">PRÉVU</span>':'')+'</td><td>'+x.w+'j'+(x.rf?'+'+x.rf+'r':'')+'</td><td>'+x.r+'j</td><td>'+(x.f||'-')+'</td><td class="am" style="color:var(--plum)">'+fH(x.h)+'</td></tr>'}return '<div class="ph"><div class="pt">Semaines<small>Récapitulatif</small></div><div class="mstep"><button onclick="prevM()">‹</button><span class="ml">'+MO[CM].substring(0,4)+'. '+CY+'</span><button onclick="nextM()">›</button></div></div><div class="card"><div style="overflow-x:auto"><table class="ptbl"><thead><tr><th>Semaine</th><th>Travail</th><th>OFF</th><th>Férié</th><th style="text-align:right">Heures</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'}

function pgStat(){var d=gMD(CY,CM),tgt=S.set.wH*4.33;var yW=0,yR=0,yC=0,yOT=0,yH=0,yF=0;for(var m=0;m<12;m++){var md=gMD(CY,m);yW+=md.w;yR+=md.r;yC+=md.c;yOT+=md.ot;yH+=md.h;yF+=md.f}var cL=S.set.cY-yC;return '<div class="ph"><div class="pt">Statistiques<small>Vue d\'ensemble</small></div><div class="mstep"><button onclick="prevM()">‹</button><span class="ml">'+MO[CM].substring(0,4)+'. '+CY+'</span><button onclick="nextM()">›</button></div></div><div class="grid g2d"><div class="card"><div class="ct">Ce mois</div>'+sbar('Heures',fH(d.h),'var(--plum)',d.h/tgt*100)+sbar('Jours travaillés',d.w+'j','var(--teal)',d.w/20*100)+sbar('OFF',d.r+'j','var(--ink3)',d.r/10*100)+sbar('Fériés',d.f+'j','var(--gold)',d.f/2*100)+sbar('Heures supp',fMin(d.ot),'var(--rust)',Math.min(d.ot/600*100,100))+'</div><div class="card"><div class="ct">Année '+CY+'</div>'+sbar('Heures totales',fH(yH),'var(--plum)',yH/(tgt*12)*100)+sbar('Jours travaillés',yW+'j','var(--teal)',yW/243*100)+sbar('OFF',yR+'j','var(--ink3)',yR/122*100)+sbar('Fériés',yF+'/11','var(--gold)',yF/11*100)+sbar('Congés pris',yC+'/'+S.set.cY,'var(--moss)',yC/S.set.cY*100)+sbar('Congés restants',cL+'j','var(--moss-s)',Math.max(cL/S.set.cY*100,0))+'</div></div>'}
