<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dispatch CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a;--bg2:#1e293b;--sf:#1e293b;--sf2:#334155;--sf3:#475569;
  --bd:#334155;--bd2:#475569;
  --tx:#f8fafc;--tx2:#cbd5e1;--tx3:#94a3b8;
  --ac:#60a5fa;--ac2:#3b82f6;--acg:rgba(96,165,250,.15);
  --gn:#4ade80;--gnb:rgba(74,222,128,.12);--gnsolid:#22c55e;
  --or:#fb923c;--orb:rgba(251,146,60,.12);
  --rd:#f87171;--rdb:rgba(248,113,113,.1);
  --yl:#facc15;--ylb:rgba(250,204,21,.12);
  --pr:#a78bfa;--prb:rgba(167,139,250,.12);
  --cy:#22d3ee;--cyb:rgba(34,211,238,.12);
  /* Calendar type colors - VIBRANT */
  --c-work:#3b82f6;--c-work-bg:#1e3a5f;--c-work-tx:#93c5fd;
  --c-rps:#8b5cf6;--c-rps-bg:#2e1f5e;--c-rps-tx:#c4b5fd;
  --c-conge:#10b981;--c-conge-bg:#064e3b;--c-conge-tx:#6ee7b7;
  --c-ferie:#f59e0b;--c-ferie-bg:#451a03;--c-ferie-tx:#fcd34d;
  --c-off-bg:#1a2236;--c-off-bd:#2a3450;--c-off-tx:#64748b;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);height:100%;overflow:hidden;display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit}input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700}.topbar h1 span{color:var(--ac)}
.topbar-btns{display:flex;gap:5px}
.topbar-btns button{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.inner{padding:12px 12px 20px;max-width:1400px;margin:0 auto}
.bnav{display:flex;border-top:1px solid var(--bd);background:var(--bg2);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px 6px;color:var(--tx3);font-size:8px;font-weight:500;gap:2px;border:none;background:none}
.bni.on{color:var(--ac)}
.bni svg{width:20px;height:20px}
.side{display:none}

.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.pt{font-size:17px;font-weight:700}.pt small{font-size:11px;color:var(--tx2);font-weight:400;margin-left:5px}
.pa{display:flex;gap:5px;flex-wrap:wrap}
.hb{padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);font-size:11px;font-weight:600;white-space:nowrap}
.hb:active{background:var(--sf2)}.hb.pri{background:var(--ac2);border-color:var(--ac2);color:#fff}
.grid{display:grid;gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.ct{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:3px}
.cv{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;line-height:1.1}
.fr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fr label{font-size:11px;color:var(--tx2);min-width:60px;font-weight:500;flex-shrink:0}
.fr select,.fr input{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:8px 10px;font-size:13px;flex:1;min-width:0}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--ac)}
.fr input[type=time],.fr input[type=number]{font-family:'JetBrains Mono',monospace}
.btn{padding:9px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600}
.bp{background:var(--ac2);color:#fff}.bd{background:var(--rdb);color:var(--rd)}.bg2{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}.bgn{background:var(--gnsolid);color:#fff}
.badge{display:inline-flex;font-size:9px;padding:2px 6px;border-radius:5px;font-weight:600}
.bgen{background:var(--acg);color:var(--ac)}.bok{background:var(--gnb);color:var(--gn)}

/* ═══ CALENDAR — VIBRANT ═══ */
.cpill{display:flex;gap:3px;margin-bottom:8px;overflow-x:auto;padding-bottom:4px}
.cpill::-webkit-scrollbar{display:none}
.cpill span{padding:4px 10px;border-radius:5px;background:var(--bg);border:1px solid var(--bd);color:var(--tx3);font-size:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
.cpill span.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.cnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cnav button{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);width:32px;height:32px;border-radius:7px;font-size:14px;display:flex;align-items:center;justify-content:center}
.cnav .cm{font-size:14px;font-weight:700;text-transform:capitalize}
.chd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.chd span{text-align:center;font-size:9px;color:var(--tx3);font-weight:600;padding:4px 0}
.cbd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}

.c{border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;min-height:54px;padding:3px 1px;gap:1px}
.c.emp{visibility:hidden}
.c:active{transform:scale(.95)}
.c.tod{border-color:var(--ac)!important;box-shadow:0 0 0 2px rgba(96,165,250,.25)}
.c.sel{background:var(--ac2)!important;color:#fff!important;border-color:#fff!important}
.c.sel .ctime{color:rgba(255,255,255,.85)!important}
.c.sel .clbl{color:rgba(255,255,255,.7)!important}

/* WORK — Blue vivid */
.c.tw{background:var(--c-work-bg);border-color:rgba(59,130,246,.35);color:var(--c-work-tx)}
.c.tw .ctime{color:var(--c-work-tx)}
/* OFF — Purple */
.c.tr{background:var(--c-rps-bg);border-color:rgba(139,92,246,.3);color:var(--c-rps-tx)}
.c.tr .clbl{color:var(--c-rps-tx)}
/* RENFORT — Orange */
.c.trf{background:rgba(234,88,12,.15);border-color:rgba(234,88,12,.35);color:#fdba74}
.c.trf .ctime{color:#fdba74}
/* CONGE — Green */
.c.tc{background:var(--c-conge-bg);border-color:rgba(16,185,129,.3);color:var(--c-conge-tx)}
/* FERIE — Amber/Gold */
.c.tf{background:var(--c-ferie-bg);border-color:rgba(245,158,11,.4);color:var(--c-ferie-tx)}
.c.tf .ctime{color:var(--c-ferie-tx)}
/* OFF — Gray subtle */
.c.toff{background:var(--c-off-bg);border:1px dashed var(--c-off-bd);color:var(--c-off-tx)}
.c.toff .clbl{color:var(--c-off-tx)}
.c.gen{opacity:.6}

.ctime{font-family:'JetBrains Mono',monospace;font-size:8px;line-height:1.1;letter-spacing:-.3px}
.clbl{font-size:8px;font-weight:700;letter-spacing:.3px}
.cfer{position:absolute;top:1px;right:2px;font-size:6px}

.dp{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}

/* SALARY */
.shero{text-align:center;padding:20px 14px;background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.08));border:1px solid var(--bd);border-radius:14px;margin-bottom:14px}
.shero .sa{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:800;color:var(--gn)}
.shero .ss{font-size:10px;color:var(--tx2);margin-top:4px}
.ptbl{width:100%;border-collapse:collapse;font-size:11px}
.ptbl th{text-align:left;padding:8px;font-size:9px;color:var(--tx3);font-weight:600;text-transform:uppercase;border-bottom:2px solid var(--bd)}
.ptbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.ptbl tr:last-child td{border-bottom:none}
.ptbl tr:hover td{background:rgba(255,255,255,.03)}
.ptbl .am{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:right}
.tg{font-size:7px;padding:2px 4px;border-radius:3px;font-weight:700;margin-right:1px}
.tn{background:var(--prb);color:var(--pr)}.td2{background:var(--ylb);color:var(--yl)}.tfe{background:rgba(245,158,11,.15);color:#fbbf24}.ts{background:var(--orb);color:var(--or)}

/* SAVINGS */
.svhero{text-align:center;padding:20px 14px;background:linear-gradient(135deg,rgba(74,222,128,.06),rgba(34,211,238,.06));border:1px solid var(--bd);border-radius:14px;margin-bottom:14px}
.svhero .sva{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:800;color:var(--gn)}
.pot{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.pottop{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.potico{font-size:22px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.potinf{flex:1;min-width:0}.potnm{font-size:13px;font-weight:700}.potbl{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;margin-top:1px}
.potgl{font-size:9px;color:var(--tx3);margin-top:1px}
.potbar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin:6px 0 3px}.potbf{height:100%;border-radius:4px}
.potpct{font-size:9px;color:var(--tx2);display:flex;justify-content:space-between}
.potbtns{display:flex;gap:4px;margin-top:10px}
.potbtns button{flex:1;padding:8px 4px;border-radius:7px;border:1px solid var(--bd);font-size:10px;font-weight:600;background:var(--bg);color:var(--tx2)}
.potbtns .pa2{border-color:rgba(74,222,128,.3);color:var(--gn);background:var(--gnb)}
.potbtns .po2{border-color:rgba(248,113,113,.2);color:var(--rd);background:var(--rdb)}
.phist{margin-top:8px;border-top:1px solid var(--bd);padding-top:6px;display:none}.phist.open{display:block}
.phr{display:flex;justify-content:space-between;padding:3px 0;font-size:9px}
.nwpot{border:2px dashed var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:80px;color:var(--tx3);font-size:13px;font-weight:600}
.sb{margin-bottom:8px}
.sbt{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px}.sbt .sl{color:var(--tx2)}.sbt .sv{font-family:'JetBrains Mono',monospace;font-weight:600}
.sbk{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.sbf{height:100%;border-radius:3px}

.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center}
.mbg.on{display:flex}
.mbox{background:var(--sf);border:1px solid var(--bd);border-radius:16px 16px 0 0;width:100%;max-width:500px;padding:20px;max-height:75vh;overflow-y:auto}
.mbox h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.mbox h3 button{background:none;border:none;color:var(--tx3);font-size:18px;cursor:pointer}

/* ═══ KPI cards with color accent ═══ */
.kcard{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--bd);position:relative;overflow:hidden}
.kcard::after{content:'';position:absolute;top:0;left:0;bottom:0;width:4px}
.kcard.kc-blue{border-left-color:var(--ac)}
.kcard.kc-purple{border-left-color:var(--pr)}
.kcard.kc-green{border-left-color:var(--gn)}
.kcard.kc-orange{border-left-color:var(--or)}
.kcard.kc-cyan{border-left-color:var(--cy)}
.kcard.kc-yellow{border-left-color:var(--yl)}

/* DESKTOP */
@media(min-width:860px){
  body{flex-direction:row}.topbar{display:none}.bnav{display:none}
  .side{display:flex;flex-direction:column;width:230px;background:var(--bg2);border-right:1px solid var(--bd);height:100vh;flex-shrink:0}
  .side-logo{padding:18px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
  .side-logo .ico{width:34px;height:34px;background:linear-gradient(135deg,var(--ac2),var(--pr));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
  .side-logo h1{font-size:14px;font-weight:700;line-height:1.2}.side-logo h1 small{display:block;font-size:10px;font-weight:400;color:var(--tx2)}
  .side-nav{flex:1;padding:10px 8px;overflow-y:auto}
  .snl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);padding:10px 10px 4px;font-weight:600}
  .snb{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border:none;background:transparent;color:var(--tx2);font-size:12px;font-weight:500;border-radius:8px;text-align:left;position:relative}
  .snb:hover{background:var(--sf2);color:var(--tx)}.snb.on{background:var(--acg);color:var(--ac);font-weight:600}
  .snb.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--ac);border-radius:0 3px 3px 0}
  .snb svg{width:17px;height:17px;flex-shrink:0;opacity:.6}.snb.on svg{opacity:1}
  .side-ft{padding:12px 14px;border-top:1px solid var(--bd);font-size:9px;color:var(--tx3)}
  .content{flex:1;background:var(--bg)}.inner{padding:22px 28px 40px}
  .g2d{grid-template-columns:1fr 1fr}.g3d{grid-template-columns:1fr 1fr 1fr}.g4d{grid-template-columns:repeat(4,1fr)}
  .lsplit{display:grid;grid-template-columns:1fr 370px;gap:16px}
  .pt{font-size:20px}.cv{font-size:26px}
  .shero .sa,.svhero .sva{font-size:40px}
  .c{min-height:60px;font-size:13px}.ctime{font-size:9px}
  .mbg.on{align-items:center}.mbox{border-radius:16px}
}
</style>
</head>

function saveTx(){var a=parseFloat(document.getElementById('txA').value);if(!a||a<=0)return alert('Montant?');var p=S.pots.find(function(x){return x.id===tPot});if(!p)return;var td=new Date();p.txs.push({date:K(td.getFullYear(),td.getMonth(),td.getDate()),amount:tDir==='in'?a:-a,note:document.getElementById('txN').value.trim()||(tDir==='in'?'Versement':'Retrait')});sv();closeMod('mTx');render()}

function pgWk(){var dim=new Date(CY,CM+1,0).getDate(),wks={};for(var d=1;d<=dim;d++){var dt=new Date(CY,CM,d),wk=iW(dt);if(!wks[wk])wks[wk]={h:0,w:0,r:0,f:0,rf:0,g:false};var dd=S.days[K(CY,CM,d)];if(!dd)continue;if(dd.gen)wks[wk].g=true;if(dd.type==='work'){wks[wk].h+=cH(dd.start,dd.end);wks[wk].w++}if(dd.type==='renfort'){wks[wk].h+=cH(dd.start,dd.end);wks[wk].rf++}if(dd.type==='rps')wks[wk].r++;if(dd.type==='ferie'){wks[wk].f++;if(dd.start&&dd.end)wks[wk].h+=cH(dd.start,dd.end)}}var rows='',keys=Object.keys(wks).sort(function(a,b){return a-b});for(var i=0;i<keys.length;i++){var w=keys[i],x=wks[w];rows+='<tr><td style="font-weight:600">S'+w+(x.g?' <span class="badge bgen">PRE</span>':'')+'</td><td>'+x.w+'j'+(x.rf?'+'+x.rf+'r':'')+'</td><td>'+x.r+'j</td><td>'+(x.f||'-')+'</td><td class="am" style="color:var(--ac)">'+fH(x.h)+'</td></tr>'}return '<div class="ph"><div class="pt">Semaines<small>'+MO[CM]+'</small></div><div class="pa"><button class="hb" onclick="prevM()">\u25C0</button><button class="hb" onclick="nextM()">\u25B6</button></div></div><div class="card"><div style="overflow-x:auto"><table class="ptbl"><thead><tr><th>Sem</th><th>Trav</th><th>OFF</th><th>Fer</th><th style="text-align:right">H</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'}
function pgFer(){var today=new Date();today.setHours(0,0,0,0);var rows='',entries=Object.entries(FER);for(var i=0;i<entries.length;i++){var k=entries[i][0],n=entries[i][1],sp=k.split('-'),y=+sp[0],m=+sp[1],d=+sp[2];var date=new Date(y,m-1,d),past=date<today,dd=S.days[k],dn=DS[date.getDay()];var st='\u2014';if(dd&&dd.type==='ferie'&&dd.start&&dd.end)st='<span style="font-family:\'JetBrains Mono\',monospace;color:var(--ac);font-size:10px">'+dd.start+'\u2192'+dd.end+'</span>';else if(dd&&dd.type==='ferie')st='<span style="color:var(--gn)">Repos</span>';rows+='<tr style="'+(past?'opacity:.4':'')+'"><td style="font-family:\'JetBrains Mono\',monospace;color:var(--yl);font-size:10px">'+String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'</td><td>'+n+'</td><td>'+dn+'</td><td>'+st+'</td></tr>'}return '<div class="ph"><div class="pt">Feries 2026</div></div><div class="card"><div style="overflow-x:auto"><table class="ptbl"><thead><tr><th>Date</th><th>Nom</th><th>Jour</th><th>Statut</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'}
function pgStat(){var d=gMD(CY,CM),tgt=S.set.wH*4.33;var yW=0,yR=0,yC=0,yOT=0,yH=0,yF=0;for(var m=0;m<12;m++){var md=gMD(CY,m);yW+=md.w;yR+=md.r;yC+=md.c;yOT+=md.ot;yH+=md.h;yF+=md.f}var cL=S.set.cY-yC;return '<div class="ph"><div class="pt">Stats<small>'+MO[CM]+'</small></div><div class="pa"><button class="hb" onclick="prevM()">\u25C0</button><button class="hb" onclick="nextM()">\u25B6</button></div></div><div class="grid g2d"><div class="card"><div style="font-weight:600;margin-bottom:10px">Mois</div>'+sbar('Heures',fH(d.h),'var(--ac)',d.h/tgt*100)+sbar('Jours',d.w+'j','var(--ac)',d.w/20*100)+sbar('OFF',d.r+'j','var(--pr)',d.r/10*100)+sbar('Feries',d.f+'j','var(--yl)',d.f/2*100)+sbar('H.Supp',fMin(d.ot),'var(--or)',Math.min(d.ot/600*100,100))+'</div><div class="card"><div style="font-weight:600;margin-bottom:10px">Annee</div>'+sbar('Heures',fH(yH),'var(--cy)',yH/(tgt*12)*100)+sbar('Jours',yW+'j','var(--ac)',yW/243*100)+sbar('OFF',yR+'j','var(--pr)',yR/122*100)+sbar('Feries',yF+'/11','var(--yl)',yF/11*100)+sbar('Conges',yC+'/'+S.set.cY,'var(--gn)',yC/S.set.cY*100)+sbar('Restants',cL+'j','var(--gn)',Math.max(cL/S.set.cY*100,0))+'</div></div>'}
function pgCfg(){return '<div class="ph"><div class="pt">Config</div></div><div class="grid g2d"><div class="card"><div style="font-weight:600;margin-bottom:10px">Parametres</div><div class="fr"><label>H/sem</label><input type="number" id="cfH" value="'+S.set.wH+'"></div><div class="fr"><label>Conges/an</label><input type="number" id="cfC" value="'+S.set.cY+'"></div><button class="btn bp" style="width:100%;margin-top:8px" onclick="S.set.wH=parseInt(document.getElementById(\'cfH\').value)||35;S.set.cY=parseInt(document.getElementById(\'cfC\').value)||25;sv();alert(\'OK\')">Sauver</button></div><div class="card"><div style="font-weight:600;margin-bottom:10px">Donnees</div><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn bg2" onclick="doExport()">Exporter</button><button class="btn bg2" onclick="document.getElementById(\'mImp\').classList.add(\'on\')">Importer</button><button class="btn bd" onclick="clrGen()">Suppr. prev.</button><button class="btn bd" onclick="if(confirm(\'Reset?\')){localStorage.removeItem(LS);location.reload()}">Reset</button></div></div></div>'}
function doExport(){navigator.clipboard.writeText(JSON.stringify(S,null,2)).then(function(){alert('Copie!')}).catch(function(){prompt('JSON:',JSON.stringify(S))})}
function doImport(){try{S=Object.assign(DEF(),JSON.parse(document.getElementById('impA').value));sv();closeMod('mImp');render()}catch(e){alert('Invalide')}}
function clrGen(){if(!confirm('Suppr?'))return;var keys=Object.keys(S.days);for(var i=0;i<keys.length;i++){if(S.days[keys[i]].gen)delete S.days[keys[i]]}sv();render()}
var now=new Date();CY=now.getFullYear();CM=now.getMonth();pY=CY;pM=CM;render();
</script>
